name: Tauranto access UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tauranto-access-ui.yml']
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/screens/HomeScreen.tsx');s=p.read_text()
          s=s.replace('label="Team & Departments"','label="Teams & Access"')
          s=s.replace('<DrawerRow dark={dark} disabled={navigating} icon="help-circle-outline" label="Help & Support" onPress={()=>closeDrawer(()=>onOpenWorkspace("help"))}/>','<DrawerRow dark={dark} disabled={navigating} icon="book-outline" label="Documentation" onPress={()=>closeDrawer(()=>onOpenWorkspace("documentation"))}/><DrawerRow dark={dark} disabled={navigating} icon="help-circle-outline" label="Help & Support" onPress={()=>closeDrawer(()=>onOpenWorkspace("help"))}/>')
          p.write_text(s)
          p=Path('src/screens/WorkspaceScreen.tsx');s=p.read_text()
          s=s.replace("import React,{useEffect,useState} from 'react';","import React,{useEffect,useState} from 'react';")
          s=s.replace("import {View,Text,TextInput,Pressable,ScrollView,StyleSheet,Switch,ActivityIndicator} from 'react-native';","import {View,Text,TextInput,Pressable,ScrollView,StyleSheet,Switch,ActivityIndicator} from 'react-native';")
          s=s.replace("import {Skeleton,SkeletonCard} from '../components/Skeleton';","import {Skeleton,SkeletonCard} from '../components/Skeleton';\nimport {DocumentationScreen} from './DocumentationScreen';")
          s=s.replace("export type WorkspacePage='profile'|'team'|'notifications'|'settings'|'security'|'help'|'locations';","export type WorkspacePage='profile'|'team'|'notifications'|'settings'|'security'|'help'|'locations'|'documentation';")
          s=s.replace("const title={profile:'Profile & restaurant',team:'Team & departments',notifications:'Notifications',settings:'Settings',security:'Security & privacy',help:'Help & support',locations:'Locations'}[page];","if(page==='documentation')return <DocumentationScreen onBack={onBack} onOpen={(target)=>{if(target==='billing')return;}}/>;const title={profile:'Profile & restaurant',team:'Teams & Access',notifications:'Notifications',settings:'Settings',security:'Security & privacy',help:'Help & support',locations:'Locations'}[page];")
          old="{page==='team'&&<><Text style={[s.copy,dark&&s.copyDark]}>Create people and departments so commands such as “notify all chefs” resolve to real recipients.</Text>"
          new="{page==='team'&&<TeamAccess restaurantId={restaurantId} ws={ws} departments={departments} dept={dept} setDept={setDept} invite={invite} setInvite={setInvite} createDepartment={createDepartment} addManager={addManager} saving={saving} dark={dark}/>}{false&&<>"
          if old not in s: raise SystemExit('team marker missing')
          s=s.replace(old,new)
          # close hidden legacy fragment immediately before notifications
          s=s.replace("</Pressable></>}\n {page==='notifications'", "</Pressable></>} </>}\n {page==='notifications'",1)
          insert="""
function TeamAccess({restaurantId,ws,departments,dept,setDept,invite,setInvite,createDepartment,addManager,saving,dark}:any){const[tab,setTab]=useState<'departments'|'teams'|'list'>('departments'),[access,setAccess]=useState<any>(null),[showStaff,setShowStaff]=useState(false),[showViewer,setShowViewer]=useState(false);const load=()=>taurantoApi.teamAccess(restaurantId).then(setAccess).catch(()=>setAccess(null));useEffect(()=>{load()},[restaurantId]);if(!['owner','manager'].includes(ws.membership?.role))return <View style={s.card}><Text style={s.cardTitle}>Restricted area</Text><Text style={s.meta}>Teams & Access is available to restaurant Owners and Managers.</Text></View>;const mask=(v:string)=>v?'••••••••••':'Not generated';const regen=async(kind:string)=>{await taurantoApi.teamAccessAction(restaurantId,'regenerate_code',{kind});await load()};return <><View style={s.accessHero}><Text style={s.accessTitle}>Team join codes</Text><Text style={s.accessCopy}>Share the appropriate code with your staff or viewers and ask them to join your restaurant.</Text><View style={s.codeRow}><Text style={s.codeLabel}>Staff Code:</Text><Text style={s.codeValue}>{showStaff?access?.codes?.staff_join_code:mask(access?.codes?.staff_join_code)}</Text><Pressable onPress={()=>setShowStaff(x=>!x)}><Ionicons name={showStaff?'eye-off-outline':'eye-outline'} size={21} color={colors.leafDeep}/></Pressable><Pressable onPress={()=>appAlert('Share Staff Code',`Send ${access?.codes?.staff_join_code||'the staff code'} to the staff member by email.`)}><Ionicons name='mail-outline' size={21} color={colors.leafDeep}/></Pressable></View><View style={s.codeRow}><Text style={s.codeLabel}>Viewer Code:</Text><Text style={s.codeValue}>{showViewer?access?.codes?.viewer_join_code:mask(access?.codes?.viewer_join_code)}</Text><Pressable onPress={()=>setShowViewer(x=>!x)}><Ionicons name={showViewer?'eye-off-outline':'eye-outline'} size={21} color={colors.leafDeep}/></Pressable><Pressable onPress={()=>appAlert('Share Viewer Code',`Send ${access?.codes?.viewer_join_code||'the viewer code'} to the viewer by email.`)}><Ionicons name='mail-outline' size={21} color={colors.leafDeep}/></Pressable></View><View style={s.regenRow}><Pressable onPress={()=>regen('staff')}><Text style={s.smallLink}>Regenerate staff</Text></Pressable><Pressable onPress={()=>regen('viewer')}><Text style={s.smallLink}>Regenerate viewer</Text></Pressable></View></View><View style={s.carousel}><Pressable onPress={()=>setTab('departments')} style={[s.carouselTab,tab==='departments'&&s.carouselActive]}><Text style={[s.carouselText,tab==='departments'&&s.carouselTextActive]}>Departments</Text></Pressable><Pressable onPress={()=>setTab('teams')} style={[s.carouselTab,tab==='teams'&&s.carouselActive]}><Text style={[s.carouselText,tab==='teams'&&s.carouselTextActive]}>Teams</Text></Pressable><Pressable onPress={()=>setTab('list')} style={[s.carouselTab,tab==='list'&&s.carouselActive]}><Text style={[s.carouselText,tab==='list'&&s.carouselTextActive]}>List</Text></Pressable></View>{tab==='departments'&&<><Text style={s.sub}>DEPARTMENTS</Text>{departments.map((d:any)=><View key={d.id} style={s.card}><View><Text style={s.cardTitle}>{d.name}</Text><Text style={s.meta}>{d.description||'No description'} · {(d.department_members||[]).length} members</Text></View></View>)}<Input v={dept.name} c={(x:string)=>setDept((p:any)=>({...p,name:x}))} placeholder='Department name'/><Input v={dept.description} c={(x:string)=>setDept((p:any)=>({...p,description:x}))} placeholder='Description'/><Pressable disabled={saving} onPress={createDepartment} style={s.primary}><Text style={s.primaryText}>Create department</Text></Pressable></>}{tab==='teams'&&<><View style={s.card}><View><Text style={s.cardTitle}>Operational teams</Text><Text style={s.meta}>Create focused teams inside departments for voice routing and day-to-day work.</Text></View></View><Text style={s.sub}>INVITE MANAGER</Text><Input v={invite.name} c={(x:string)=>setInvite((p:any)=>({...p,name:x}))} placeholder='Full name'/><Input v={invite.email} c={(x:string)=>setInvite((p:any)=>({...p,email:x}))} placeholder='Email' keyboard='email-address'/><Input v={invite.phone} c={(x:string)=>setInvite((p:any)=>({...p,phone:x}))} placeholder='Phone' keyboard='phone-pad'/><Pressable onPress={addManager} style={s.primary}><Text style={s.primaryText}>Invite manager</Text></Pressable></>}{tab==='list'&&<><Text style={s.sub}>EVERYONE WITH ACCESS</Text>{(access?.members||[]).map((m:any)=><View key={m.user_id} style={s.memberLine}><View style={{flex:1}}><Text style={s.cardTitle}>{m.profiles?.full_name||'Team member'}</Text><Text style={s.meta}>{m.profiles?.email||'No email'}{m.profiles?.phone?` · ${m.profiles.phone}`:''}</Text></View><View style={s.rolePill}><Text style={s.roleText}>{m.role==='operator'?'STAFF':String(m.role).toUpperCase()}</Text></View></View>)}</>}</>}
"""
          s=s.replace("function Label({t}:{t:string})",insert+"\nfunction Label({t}:{t:string})")
          s=s.replace("const s=StyleSheet.create({", "const s=StyleSheet.create({accessHero:{backgroundColor:'#EDF8F1',borderWidth:1,borderColor:'#D7ECDD',borderRadius:20,padding:16,marginBottom:16},accessTitle:{fontFamily:'NunitoSans_900Black',fontSize:20,color:'#173526'},accessCopy:{fontFamily:'NunitoSans_600SemiBold',fontSize:13,lineHeight:19,color:'#5E6D63',marginTop:4,marginBottom:12},codeRow:{minHeight:45,flexDirection:'row',alignItems:'center',gap:8,borderTopWidth:1,borderTopColor:'#DDEAE1'},codeLabel:{fontFamily:'NunitoSans_900Black',fontSize:13,color:'#25362B'},codeValue:{flex:1,fontFamily:'NunitoSans_800ExtraBold',fontSize:13,color:'#1C2820'},regenRow:{flexDirection:'row',gap:20,marginTop:8},smallLink:{fontFamily:'NunitoSans_900Black',fontSize:12,color:colors.leafDeep},carousel:{flexDirection:'row',backgroundColor:'#EEF2EF',borderRadius:15,padding:4,marginBottom:18},carouselTab:{flex:1,minHeight:43,alignItems:'center',justifyContent:'center',borderRadius:12},carouselActive:{backgroundColor:'#fff'},carouselText:{fontFamily:'NunitoSans_800ExtraBold',fontSize:13,color:'#6E7971'},carouselTextActive:{color:colors.leafDeep},memberLine:{minHeight:72,backgroundColor:'#fff',borderWidth:1,borderColor:'#E5EAE5',borderRadius:15,padding:13,marginBottom:9,flexDirection:'row',alignItems:'center',gap:8},rolePill:{backgroundColor:'#EAF6EE',paddingHorizontal:9,paddingVertical:6,borderRadius:9},roleText:{fontFamily:'NunitoSans_900Black',fontSize:10,color:colors.leafDeep},")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/HomeScreen.tsx src/screens/WorkspaceScreen.tsx
          git commit -m "Build Teams and Access experience and documentation navigation"
          git push
