name: Run Tauranto Jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  process-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Process approved Tauranto commands
        env:
          APP_URL: ${{ secrets.TAURANTO_APP_URL }}
          CRON_SECRET: ${{ secrets.TAURANTO_CRON_SECRET }}
        run: |
          curl --fail --show-error --silent \
            --request GET \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/jobs/run"