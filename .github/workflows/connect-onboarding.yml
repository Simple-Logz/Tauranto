name: Connect onboarding UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-onboarding.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route missing restaurant membership to onboarding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('App.tsx')
          s=p.read_text()
          old='if(!session)return <SafeAreaProvider><AuthScreen/></SafeAreaProvider>;if(!restaurantId)return <SafeAreaProvider><View style={sp.center}><ActivityIndicator color={colors.leafDeep}/><Text>Loading your restaurant workspace…</Text></View></SafeAreaProvider>;'
          new='if(!session)return <SafeAreaProvider><AuthScreen/></SafeAreaProvider>;if(!restaurantId&&workspaceError)return <SafeAreaProvider><WorkspaceRecoveryScreen message={workspaceError} onRetry={retryWorkspace}/></SafeAreaProvider>;if(!restaurantId)return <SafeAreaProvider><View style={sp.center}><ActivityIndicator color={colors.leafDeep}/><Text>Loading your restaurant workspace…</Text></View></SafeAreaProvider>;'
          if old not in s:
              raise SystemExit('loader render pattern not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "Route users without restaurants into onboarding"
          git push
