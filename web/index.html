<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F1" />
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none; background: #FAF8F1; }
    html, body { position: fixed; inset: 0; touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; }
    #root { position: absolute; inset: 0; }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <noscript>You need JavaScript enabled to run Tauranto.</noscript>
  <div id="root"></div>
</body>
</html>
